# /etc/nginx/sites-available/blog  ->  ln -s ... /etc/nginx/sites-enabled/
# Keyin HTTPS uchun:  sudo certbot --nginx -d example.com -d www.example.com
server {
    listen 80;
    server_name example.com www.example.com;

    client_max_body_size 7m;   # muqova rasmi (6 MB gacha)

    location /static/ {
        alias /opt/blog/static/;
        expires 7d;
        access_log off;
    }

    # Yuklangan rasmlar (DATA_DIR/uploads). Faylga to'g'ridan-to'g'ri beradi, gunicornni band qilmaydi
    location /media/ {
        alias /var/lib/blog/uploads/;
        expires 365d;
        access_log off;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # /admin ga login urinishlarini cheklash (ixtiyoriy, nginx.conf http{} ichiga
    # limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/m; qo'shing)
    # location = /admin {
    #     limit_req zone=admin burst=5 nodelay;
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
